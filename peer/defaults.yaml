# AI Peer default settings. The live copy is ~/.ai-peer/<owner>/settings.yaml (made from this
# file on first run); edit that one, or use `peer set <key> <value>`. The watcher re-reads it.

owner:
  id: manish                    # folder name under ~/.ai-peer/
  profile: peer/world/profiles/manish.json   # the directory adapter's record (repo-relative)

adapters:                       # what `peer port-check` checks (WP5; docs/porting-guide.md). A port adds or swaps entries.
  # Each entry: module + class (a subclass of peer.adapters.base.Adapter); optional query (port-check's search
  # word), sample (the dry-run act, when the class has no dry_run_sample()), blocked_by (its exception names that
  # mean "a hard block refused"), pending (shown as "not on main yet" until that PR merges), enabled: false.
  # The runtime still builds its own adapters (porting guide: "What a port also edits today").
  directory: {module: peer.adapters.directory, class: DirectoryAdapter, query: Telugu}
  slack: {module: peer.adapters.slack, class: SlackAdapter, query: Telugu}
  github: {module: peer.adapters.github, class: GitHubAdapter, query: Telugu}
  fake: {module: peer.adapters.fake, class: FakeAdapter}
  google:                       # Gmail, Calendar, Drive/Docs (WP3); needs `peer google login peer` first
    module: peer.adapters.google
    class: GoogleAdapter
    query: Telugu
    blocked_by: [Blocked]       # google.act_on_real_items off: act only on seeded test items
    sample: {action: draft_reply, target_from_search: "in:inbox", target_prefix: "google:mail:", payload: {body: "port-check (dry run)"}}
  meetings:                     # Recall.ai meeting bot on Zoom: on PR #5 until it merges
    module: peer.adapters.meetings
    class: MeetingsAdapter
    pending: "PR #5"
    blocked_by: [MeetingRefused]   # meetings.join_real_meetings off: only the test meeting
    sample: {action: join, target: "", payload: {meeting_url: "https://zoom.us/j/99999999999", bot_name: "port-check"}}
  voice:                        # text to speech for the meeting bot: on PR #5 until it merges
    module: peer.adapters.voice
    class: VoiceAdapter
    pending: "PR #5"
    sample: {action: render, target: peer, payload: {text: "port-check."}}

presence:
  manual: auto                  # auto | away | online   (the "I'm away" switch)
  away_status_words: [vacation, holiday, ooo, "out of office", away, sick, leave, offline, travelling, traveling]
  away_status_emoji: [":palm_tree:", ":airplane:", ":face_with_thermometer:", ":sleeping:", ":no_entry:", ":house_with_garden:"]

roles:                          # F3 switches (the settings page; a role turned off stops that behaviour)
  watch_my_work: true
  stand_in_when_away: true
  find_opportunities: true
  cover_meetings: true
  daily_brief: true

scope: {}                      # F3: plain-English scope per role, from the settings page (mirrored into rules.md)

memory:
  nightly_at: "02:30"           # F6: the nightly re-read, owner's local time
  resummarize_minutes: 360      # F6: a changed tracker is re-copied at once; the brain re-writes its status at most this often

local:                          # F7: local work
  folders: []                   # folders the hourly scan reads (the owner chooses, e.g. ~/repos); read-only
  scan_minutes: 60

brain:
  backend: claude               # claude | codex   (F8: one setting)
  fallback: true                # on a rate limit or failure, try the other backend once
  timeout_s: 240
  claude_bin: ~/.ai-peer/bin/claude-2.1.318   # pinned copy (spike 1a); falls back to `claude` if missing
  claude_model: opus            # Opus, not Fable: the weekly Fable allowance is account-wide (it would stop other sessions)
  claude_effort: high           # measured on S1 (dry run, 4 Nov): max 113-139 s per answer breaks the 1-2 min limits; high 21-27 s
  summary_effort: max           # discovery summaries have no time limit: best effort
  refresh_effort: high          # F6: re-summaries of changed trackers (they change many times a day)
  codex_bin: codex
  codex_model: ""               # empty = the CLI's default for the login (gpt-6-astra on 0.153.4)
  codex_home: ~/.ai-peer/codex-home

slack:
  debounce_s: 6                 # wait this long for more messages in a thread before thinking
  watch_channels: []            # empty = every channel the bot is in

github:
  poll_minutes: 15

google:                         # WP3: Gmail, Calendar, Drive/Docs (docs/build/setup/google.md); no AI on the poll
  poll_minutes: 2
  show_real_items: false        # seeded-only view: until the owner turns this on, only seeded test items are used or
                                #   shown (brief, heads-ups, memory, setup lines); real ones are only counted
  act_on_real_items: false      # hard block: drafts, sends and invite answers only on seeded test items until lifted

brief:                          # S2: the daily brief (role "Daily brief"); also on "brief me" in the DM
  at: "09:00"                   # every working morning, owner's local time
  lookback_hours: 18            # "while you were away" when there is no earlier brief
  email_days: 3                 # mail still waiting on you: how far back
  max_items: 12
  effort: ""                    # empty = brain.claude_effort

web:
  host: 127.0.0.1
  port: 8787

meetings:                       # S3 (WP4): attend a meeting for the owner; all of it is gated on roles.cover_meetings
  join_real_meetings: false     # HARD BLOCK: until the owner lifts it in his own words, a bot joins only the test meeting
                                # (the Zoom meeting id in ZOOM_TEST_MEETING_URL); his real calendar has real people in it
  bot_name: "{first}'s AI Peer"
  colleague_bot_name: "{name} (scripted test bot)"
  live_model: opus              # the warm session (D7); never Fable
  live_effort: medium           # spike, 6 Nov: the spoken answer ready in about 2 to 4 s at low/medium, up to 9 s at high
  listener_port: 8795           # the webhook listener only; the tunnel points here and nowhere else
  max_minutes: 10               # a bot leaves after this long recording (in_call_recording_timeout)
  offer_cover: true             # the Peer may offer "Cover for me" in the DM for a meeting it sees; it joins only what he hands it

voice:
  engine: local                 # local (the Mac's say voices + ffmpeg) | elevenlabs (the walk's clips and fixed lines only)
  pad_ms: 1000                  # silence in front of every clip (spike 1d: Recall loses the first second)
  elevenlabs_budget_chars: 20000   # WP4's whole budget on a key shared with a live product; the ledger is in ~/.ai-peer/voice-cache/
  elevenlabs_model: eleven_multilingual_v2       # prepared clips: the intro, the holding line, the update, the colleagues
  elevenlabs_live_model: eleven_flash_v2_5       # live answers: the fast model
  voices:                       # one setting per voice, so the owner can choose by ear; stock (premade) voices only, never his own
    peer: {local: Samantha, elevenlabs: XrExE9yKIg1WjnnlVkGX}       # Matilda (premade, American)
    holding: {local: Samantha, elevenlabs: XrExE9yKIg1WjnnlVkGX}    # the Peer's own voice
    ananya: {local: Tara, elevenlabs: pFZP5JQG7iQjIQuC4Bku}         # Lily (premade, British)
    kabir: {local: Rishi, elevenlabs: iP95p4xoKVk53GoZ742B}         # Chris (premade, American)
    lakshmi: {local: Tara, elevenlabs: Xb7hH8MSUJpSbSDYk0k2}        # Alice (premade, British)
    david: {local: "Reed (English (US))", elevenlabs: cjVigY5qzO86Huf0OWal}   # Eric (premade, American)
    rohan: {local: Rishi, elevenlabs: bIHbv24MWmeRgasZH58o}         # Will (premade, American)
