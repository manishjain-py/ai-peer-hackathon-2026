# S1 Slack cover, owner away (PRD S1). The Peer replies in the thread by itself within about
# two minutes: who it is, that the owner is offline and the local time, the answer with sources
# and dates; it handles the follow-up; the owner finds it in his DM.
name: s1-away
title: "S1 Slack cover: Manish away"
presence: away
channel: partners
steps:
  - post: {as: sam, text: "Hi team, quick one: who is driving offline mode, and is it shipping this month? Two partner teams asked me today."}
    expect: {thread_reply: true, within_s: 180}
  - post: {as: sam, in_thread: true, text: "Thanks, that helps! Will it cover search and sharing too, or only editing at first? And will it be on the iPhone app?"}
    expect: {thread_reply: true, within_s: 180}
  - expect: {owner_dm: true, within_s: 30}
