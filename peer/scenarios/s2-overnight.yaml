# S2 daily brief and heads-ups (PRD S2): an overnight of mail, invites and company news from the
# invented colleagues (aliases of the seed account, to the owner only), plus the real GitHub
# activity the Peer already reads. One item is urgent: it must arrive as a heads-up at once, not
# in the brief. One event does not fit the owner's interests: the brief should leave it out.
# kinds: waiting (asks the owner something), urgent, announcement (company news), event (an
# event or opportunity by mail); invites are calendar invitations (.ics).
name: s2-overnight
title: "S2 daily brief: an overnight of mail, invites and company news"
presence: away
mail:
  - as: alex
    kind: waiting
    subject: "Offline mode beta: OK to start the partner review on Monday?"
    body: |
      Hi Manish,

      The offline mode beta build is ready. I'd like to start the review on Monday
      with two people from Sam's partner pilots, three flows each.

      Two things I need from you:
      1. Are you fine with partners (not our team) doing the first review?
      2. Should they review in the app, or on the sheet export?

      Thanks,
      Alex
  - as: sam
    kind: waiting
    subject: "Two partner teams want an offline mode pilot in December"
    body: |
      Hi Manish,

      Both partner teams I met this week want to pilot Fernway Notes with offline mode in
      December. They asked me for a start date and whether search works offline by then.

      Can you tell me what I can promise them? I'll reply to their leads once I hear from you.

      Sam
  - as: jordan
    kind: waiting
    subject: "Intro: a productivity software fund partner would like 20 minutes next week"
    body: |
      Manish,

      A partner at a fund that backs productivity software saw the offline mode work and asked for a short call next week.
      No deck needed. Could you send me two or three times that work for you (US mornings are
      easiest for them)?

      Jordan
  - as: riley
    kind: urgent
    subject: "Urgent: App Store rejected iOS 2.4, can you answer the reviewer today?"
    body: |
      Manish, Apple rejected build 2.4 overnight: they want the account deletion flow shown inside
      the app before they approve it. The release is blocked until we reply.

      Can you answer the reviewer today, or should I? I need your call before 2 PM.

      Riley
  - as: alex
    kind: announcement
    subject: "[Fernway] Writing style guide v3 is live"
    body: |
      Hi all,

      Version 3 of the writing style guide is live. What changed: shorter in-app tips (at most
      60 words), one worked example per help article, and product terms now come
      from the shared glossary sheet. Release notes and help articles should follow v3 from next week.

      Alex
  - as: taylor
    kind: announcement
    subject: "[Fernway] Design reviews move to Thursdays, 4 PM IST"
    body: |
      Hi everyone,

      From next week, design reviews move to Thursdays at 4 PM IST so Jordan can join from the US.
      Bring anything that changes what users see.

      Taylor
  - as: jordan
    kind: event
    subject: "Event: AI assistants at work, online meetup on 20 Nov"
    body: |
      Manish, this looks like your kind of conversation: an online meetup on AI assistants and coding
      agents at work, 20 Nov, 7 PM IST. They are looking for two short talks (10 minutes)
      on building AI teammates. Speaker slots close on 12 Nov.

      Jordan
  - as: sam
    kind: event
    subject: "Event: a regional meetup of team leads, Mumbai, 3 Dec"
    body: |
      Manish, the regional meetup of team leads is on 3 Dec in Mumbai. About 150 team leads,
      many from teams that work offline in the field. There is a small demo area if we want a table.

      Sam
  - as: taylor
    kind: event
    subject: "Webinar: Instagram ads for D2C fashion brands"
    body: |
      Sharing in case it's useful: a free webinar on Instagram ads for D2C fashion brands, Friday 5 PM.

      Taylor
invites:
  - as: taylor
    summary: "Sync settings: design review"
    in_days: 1
    at: "11:00"
    minutes: 30
    description: "Walk through the new sync settings screen before it ships in the web and iOS apps."
  - as: jordan
    summary: "Advisor check-in: the growth plan for partners"
    in_days: 2
    at: "21:30"
    minutes: 30
    description: "Monthly check-in. Agenda: the partner pilot funnel and what to measure in December."
