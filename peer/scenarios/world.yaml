# The test world (DESIGN D4): Fernway, a fictional company that makes Fernway Notes, a note-taking app.
# The company, its people and their example.com addresses are invented; the owner's profile says what he
# owns. These colleagues are played by the scenario script. Their Slack accounts use the email aliases
# below; the script posts as them with their user tokens (SLACK_AS_<ID> in ~/.ai-peer/.env), or, without
# one, through the scenario bot.

company: Fernway
workspace: fernway
owner: manish

mail:                           # WP3: the colleagues' addresses are aliases of this mailbox (kept apart from the owner's)
  seed_account: seed@example.com   # its own Google login, gmail.send only, for the scenario script

channels:
  - name: general
    purpose: Company-wide news and questions.
  - name: product
    purpose: Product questions, plans and launches.
  - name: design
    purpose: Design reviews and the app's look.
  - name: partners
    purpose: Partner teams, pilots and what partners ask for.
  - name: engineering
    purpose: Engineering, releases and CI.

colleagues:
  - person_id: alex
    name: Alex Rivera
    title: Product Lead
    tz: Asia/Kolkata
    city: Bengaluru
    email: alex@example.com
    about: Leads the product plan and the offline-mode launch notes.
  - person_id: taylor
    name: Taylor Brooks
    title: Design Lead
    tz: Asia/Kolkata
    city: Pune
    email: taylor@example.com
    about: Designs the web and iOS apps and the sync settings screen.
  - person_id: sam
    name: Sam Moreno
    title: Partnerships Lead
    tz: Asia/Kolkata
    city: Mumbai
    email: sam@example.com
    about: Runs the partner pilots; partner teams that need offline mode are the main pipeline.
  - person_id: jordan
    name: Jordan Ellis
    title: Advisor (US)
    tz: America/Los_Angeles
    city: San Francisco
    email: jordan@example.com
    about: US-based advisor; joins the weekly product sync.
  - person_id: riley
    name: Riley Chen
    title: iOS Engineer
    tz: Asia/Kolkata
    city: Bengaluru
    email: riley@example.com
    about: Works on the iOS app releases.
